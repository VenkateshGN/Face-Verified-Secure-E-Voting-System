spring.application.name=face-verified-voting-system
server.port=${PORT:8080}

# Database Configuration (Overrides via Environment Variables or spring.profiles.active=tidb)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/votesystem?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=false
spring.h2.console.path=/h2-console

# File Upload Configurations
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB

# Thymeleaf Template Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# Simulated Mail (Set host/port/username/password for live SMTP production dispatch)
spring.mail.host=localhost
spring.mail.port=25
