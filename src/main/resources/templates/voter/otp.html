<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: header('OTP Verification - Stage 3')}"></head>
<body class="d-flex flex-column justify-content-between">
    <div th:replace="~{fragments/layout :: voterNavbar}"></div>

    <main class="container my-auto py-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="glass-card p-4 p-md-5 text-center">
                    
                    <!-- Step Indicator -->
                    <div class="d-inline-flex p-3 rounded-circle bg-success bg-opacity-10 text-success mb-3">
                        <i class="fa-solid fa-mobile-screen-button fa-2x"></i>
                    </div>
                    
                    <h3 class="fw-bold text-success mb-1">Two-Factor OTP Verification</h3>
                    <p class="text-muted small mb-3">
                        We dispatched a 6-digit verification code to your registered address:
                        <br><strong class="text-dark" th:text="${maskedEmail}">registered email</strong>
                    </p>

                    <!-- Alerts -->
                    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show rounded-3 py-2 px-3 small text-start" role="alert">
                        <i class="fa-solid fa-triangle-exclamation me-1"></i> <span th:text="${error}"></span>
                        <button type="button" class="btn-close btn-close-sm" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                    <div th:if="${success}" class="alert alert-success alert-dismissible fade show rounded-3 py-2 px-3 small text-start" role="alert">
                        <i class="fa-solid fa-circle-check me-1"></i> <span th:text="${success}"></span>
                        <button type="button" class="btn-close btn-close-sm" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>

                    <!-- Development Simulation Toast -->
                    <div th:if="${simulatedOtp != null}" class="alert alert-light border border-success border-opacity-50 rounded-3 text-start p-2 mb-3 small bg-white">
                        <div class="d-flex align-items-center justify-content-between">
                            <span class="text-muted"><i class="fa-solid fa-envelope-open-text text-success me-1"></i> <b>Simulated Email OTP:</b></span>
                            <span class="badge bg-success fs-6" th:text="${simulatedOtp}">123456</span>
                        </div>
                    </div>

                    <!-- Countdown Timer -->
                    <div class="mb-4">
                        <span class="badge bg-warning bg-opacity-15 text-dark border border-warning rounded-pill px-3 py-2">
                            <i class="fa-regular fa-clock me-1 text-warning"></i> Expires in: <span id="timerText" class="fw-bold">05:00</span>
                        </span>
                    </div>

                    <!-- Form -->
                    <form th:action="@{/verify-otp}" method="POST" id="otpForm">
                        <div class="mb-4">
                            <input type="text" name="otp" id="otpInput" maxlength="6" pattern="[0-9]{6}" class="form-control text-center fs-3 fw-bold tracking-widest" placeholder="&bull; &bull; &bull; &bull; &bull; &bull;" style="letter-spacing: 8px; height: 56px;" required autofocus>
                        </div>

                        <button type="submit" class="btn btn-emerald w-100 py-2 d-flex align-items-center justify-content-center gap-2 mb-3">
                            <span>Verify Code & Open Ballot</span>
                            <i class="fa-solid fa-check"></i>
                        </button>
                    </form>

                    <form th:action="@{/resend-otp}" method="POST" class="d-inline">
                        <button type="submit" id="btnResend" class="btn btn-link text-success text-decoration-none small">
                            <i class="fa-solid fa-arrow-rotate-right me-1"></i> Resend OTP Code
                        </button>
                    </form>

                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/layout :: scripts}"></div>

    <script>
        // 5-minute countdown timer (300 seconds)
        let timeLeft = 300;
        const timerText = document.getElementById('timerText');

        const interval = setInterval(() => {
            timeLeft--;
            if (timeLeft <= 0) {
                clearInterval(interval);
                timerText.innerText = "EXPIRED";
                document.getElementById('otpInput').disabled = true;
                Swal.fire({
                    icon: 'error',
                    title: 'OTP Expired',
                    text: 'The 5-minute verification window has expired. Please click Resend OTP.',
                    confirmButtonColor: '#10b981'
                });
            } else {
                const minutes = Math.floor(timeLeft / 60);
                const seconds = timeLeft % 60;
                timerText.innerText = (minutes < 10 ? "0" : "") + minutes + ":" + (seconds < 10 ? "0" : "") + seconds;
            }
        }, 1000);
    </script>
</body>
</html>
