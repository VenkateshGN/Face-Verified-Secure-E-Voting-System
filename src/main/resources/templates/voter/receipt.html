<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: header('Ballot Receipt - Verification Token')}"></head>
<body class="d-flex flex-column justify-content-between">
    <div th:replace="~{fragments/layout :: voterNavbar}"></div>

    <main class="container my-auto py-5">
        <div class="row justify-content-center">
            <div class="col-lg-7 col-xl-6">
                <div class="glass-card p-4 p-md-5 text-center position-relative">
                    
                    <!-- Official Watermark Stamp -->
                    <div class="d-inline-flex p-3 rounded-circle bg-success bg-opacity-10 text-success mb-3">
                        <i class="fa-solid fa-stamp fa-2x"></i>
                    </div>

                    <h3 class="fw-bold text-success mb-1">Official Ballot Receipt</h3>
                    <div class="mb-2" th:if="${electionSetting != null}">
                        <span class="badge rounded-pill px-3 py-1" th:classappend="${electionSetting.organizationTypeBadgeClass}">
                            <i th:class="${electionSetting.organizationTypeIcon} + ' me-1'"></i>
                            <span th:text="${electionSetting.organizationName}">Organization Name</span>
                        </span>
                    </div>
                    <p class="text-muted small mb-4" th:text="${electionSetting != null ? electionSetting.electionTitle : electionTitle}">National General Election</p>

                    <div th:if="${success}" class="alert alert-success alert-dismissible fade show rounded-3 py-2 px-3 small text-start mb-4" role="alert">
                        <i class="fa-solid fa-circle-check me-1"></i> <span th:text="${success}"></span>
                        <button type="button" class="btn-close btn-close-sm" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>

                    <!-- Receipt Details Card -->
                    <div class="card border border-success border-opacity-25 rounded-4 p-4 text-start bg-white mb-4 shadow-sm">
                        <div class="row g-3">
                            <div class="col-sm-6">
                                <small class="text-muted d-block">Voter Name</small>
                                <strong class="text-dark" th:text="${voter.fullName}">Voter Name</strong>
                            </div>
                            <div class="col-sm-6">
                                <small class="text-muted d-block" th:text="${electionSetting != null ? electionSetting.voterIdLabel : 'Voter ID'}">Voter ID</small>
                                <span class="badge bg-light text-dark border" th:text="${maskedVoterId}">VOTER_***</span>
                            </div>
                            <div class="col-sm-6">
                                <small class="text-muted d-block">Time Cast</small>
                                <span class="text-dark fw-medium" th:text="${voter.votedAt != null ? voter.votedAt : 'Confirmed'}">Timestamp</span>
                            </div>
                            <div class="col-sm-6">
                                <small class="text-muted d-block">Integrity Status</small>
                                <span class="badge bg-success text-white"><i class="fa-solid fa-shield-halved me-1"></i> Blockchain Sealed</span>
                            </div>
                            <div class="col-12 border-top pt-2">
                                <small class="text-muted d-block">Tracking Token (Zero-Knowledge Verifier)</small>
                                <code class="text-success fs-6 fw-bold" th:text="${trackingToken}">UUID-TOKEN</code>
                            </div>
                        </div>

                        <!-- QR Code Section -->
                        <div class="text-center mt-4 pt-3 border-top">
                            <small class="text-muted d-block mb-2">Scan QR to verify ballot inclusion in Blockchain Ledger:</small>
                            <img th:src="${qrCodeDataUrl}" class="border p-2 rounded-3 shadow-xs" alt="Verification QR Code" style="width: 170px; height: 170px;">
                        </div>
                    </div>

                    <!-- Actions -->
                    <div class="d-flex flex-wrap justify-content-center gap-2">
                        <button onclick="window.print()" class="btn btn-outline-success rounded-pill px-4">
                            <i class="fa-solid fa-print me-1"></i> Print Receipt
                        </button>
                        <a th:href="@{'/verify-receipt?token=' + ${trackingToken}}" class="btn btn-emerald rounded-pill px-4">
                            <i class="fa-solid fa-magnifying-glass me-1"></i> Verify on Ledger
                        </a>
                        <a href="/logout" class="btn btn-light rounded-pill px-3">
                            <i class="fa-solid fa-door-open me-1"></i> Exit
                        </a>
                    </div>

                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
